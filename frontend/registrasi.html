<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Manajemen Buku (FastAPI)</title>
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .batas{
            border-top: 1px solid #ccc;
            margin-top: 18px;
            padding-top: 5px;
        }

        body{
            background: #ECE9E6;
            background: -webkit-linear-gradient(to right, #FFFFFF, #ECE9E6);
            background: linear-gradient(to right, #FFFFFF, #ECE9E6);
        }

        .card{
            width: 500px !important; 
            height: 780px !important; 
            background-color: #fefefe !important;
        }
        form .row.mb-1 .col-12 a p{
            font-size: 11px;;
        }

        form .row.mb-1 .col-12 a{
            text-decoration: none;
            width: max-content;
            background-color: #00913f;
            color: #fff;
            padding: 3px 10.5px;
            border-radius: 5px;
            font-weight: 600;
        }
    </style>

</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-item-center" style="height: 100vh;">
        <div class="row col-md-6 mt-3 justify-content-center align-item-center">
            <div class="card shadow sm p-3 m-5 bg-body rounded">
                <div class="card-body justify-content-center">
                    <form action="post">
                        <div class="row mb-1">
                            <div class="col-12">
                                <a href="/login.html" class="d-flex gap-2">
                                    <i class="bi bi-arrow-bar-left align-content-center"></i>
                                    <p class="m-0 p-0 align-content-center">Login, jika sudah punya akun</p>
                                </a>
                            </div>
                        </div>
                        <div class="batas"></div>
                        <div class="row" style="margin-bottom: 1.5em; margin-top: 1.25rem">
                            <div class="col-12 text-start">
                                <h3 class="fs-2 fw-bold">Registrasi User</h3>
                                <p class="fs-5 fw-light">Manajemen Buku Sederhana</p>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-3">
                            <div class="col-3 align-content-center">
                                <label for="username" class="form-label fw-bold">Username</label>
                            </div>
                            <div class="col-auto">
                                <input class="form-control" id="username"/>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-4">
                            <div class="col-3 align-content-center">
                                <label for="nama" class="form-label fw-bold">Nama</label>
                            </div>
                            <div class="col-auto">
                                <input type="text" class="form-control" id="nama"/>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-3">
                            <div class="col-3 align-content-center">
                                <label for="password" class="form-label fw-bold">Password</label>
                            </div>
                            <div class="col-auto">
                                <input type="password" class="form-control" id="password"/>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-3">
                            <div class="col-3 align-content-center w-100">
                                <label for="conf_password" class="form-label fw-bold">Konfirmasi Password</label>
                            </div>
                            <div class="col-auto">
                                <input type="password" class="form-control" id="conf_password"/>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-4">
                            <div class="col-3 align-content-center w-100">
                                <label for="list_role" class="form-label fw-bold">Role</label>
                            </div>
                            <div class="col-auto">
                               <select class="form-select" id="list_role">
                                <option value="" selected>Pilih Role User</option>
                                <option value="admin">admin</option>
                            </select> 
                            </div>
                        </div> 

                        <div class="g-3">
                            <button class="btn btn-primary mx-auto" type="button" style="width: 100%;" onclick="registrasiUser(event);">Registrasi</button>
                        </div>

                        <div class="batas"></div>

                        <p class="text-start fw-light">@2026 Damar Djati Wahyu Kemala</p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registrasi.js"></script>
</body>
</html>
