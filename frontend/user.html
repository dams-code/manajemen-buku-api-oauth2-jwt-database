<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Buku (FastAPI)</title>
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="node_modules/sweetalert2/dist/sweetalert2.min.css">

    <script src="js/cek_token.js"></script>
    
    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>

    <style>
        html, body{
            overflow: hidden;
        }

        .batas{
            border-top: 1px solid #ccc;
            margin-top: 30px;
            padding-top: 5px;
        }

        .navbar-brand p:last-child{
            font-size: 0.815rem;
        }

        body nav:first-child{
            padding-bottom: 0 !important;
        }

        body nav:nth-child(2){
            background-color: #545454;
            box-shadow: 1px 3px 7px rgba(0, 0, 0, 0.29);
            padding: 8px 0;
            display: inline-block;
            width: 100%;
            padding-left: 0.8rem;
            padding-bottom: 12px;
        }

        body nav:nth-child(2) ol{
            margin-bottom: 0 !important;
        }

        body nav:nth-child(2) ol li:last-child,
        body nav:nth-child(2) ol li:last-child::before{
            color: #fff;
        }

        body nav:nth-child(2) ol li:first-child a{
            color: #1da0ff !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid" style="border-bottom: 1px solid #1b1b1b;">
            <div class="navbar-brand">
                <p class="fs-2 m-0">Manajemen Buku sederhana</p>
                <p class="text-start fw-light m-0">@2026 Damar Djati Wahyu Kemala</p>
            </div>
            
            <ul class="nav nav-tabs">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex gap-2 align-items-center" data-bs-toggle="dropdown" role="button" aria-expanded="false" href="javascript:void(0);">
                        <span id="userAktif"></span>
                        <span id="userRoleAktif" class="badge bg-secondary"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="edituser.html">Edit User</a></li>
                        <li>
                            <a class="dropdown-item bg-primary bg-opacity-10 text-primary" href="gantipassword.html">
                                Ganti Password
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="dropdown-item text-danger" type="button" onclick="logout();" >
                                Logout
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Halaman Utama</a></li>
            <li class="breadcrumb-item active" aria-current="page">User</li>
        </ol>
    </nav>

    <div class="container">
        <div class="row col-12 mt-3">
            <div class="text-end mb-3">
                <button class="btn btn-primary" id="btnTambahUser" type="button" data-bs-toggle="modal" data-bs-target="#modaluser" onclick="setTambahUser();" style="display: none;">
                    <i class="bi bi-person-add"></i> Tambah User
                </button>
            </div>

            <table class="table table-light table-stripped text-center shadow p-3 mb-5 bg-body-tertiary rounded">
                <thead>                    
                    <th>no</th>
                    <th>username</th>
                    <th>nama</th>
                    <th>role</th>
                    <th>Aksi</th>
                </thead>
                <tbody ID="dataUser"></tbody>
            </table>
        </div>
        
    </div>

    <div class="modal fade" id="modaluser" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalJudul"></h1>
                </div>
                <div class="modal-body">
                    <form method="post">
                        <div class="d-grid row-gap-3">
                            <input type="text" id="idUser" style="visibility: hidden !important;">
                            <div class="row align-items-center gap-3">
                                <div class="col-2">
                                    <label for="username" class="col-form-label">username</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" id="username" class="form-control" disabled="true"/>
                                </div>
                            </div>
                            <div class="row align-items-center gap-3">
                                <div class="col-2">
                                    <label for="nama" class="col-form-label">nama</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" id="nama" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center gap-3" id="form-password">
                                <div class="col-2">
                                    <label for="password" class="col-form-label">password</label>
                                </div>
                                <div class="col-auto">
                                    <input type="password" id="password" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center gap-3">
                                <div class="col-2">
                                    <label for="list_role" class="col-form-label">Role</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="list_role">
                                        <option value="" selected>Pilih role</option>
                                        <option value="admin">admin</option>
                                        <option value="manajer">manajer</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="simpan_user();" id="btnSimpanUser">Simpan</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="batas"></div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sesi_user_aktif.js"></script>
    <script src="js/user.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
