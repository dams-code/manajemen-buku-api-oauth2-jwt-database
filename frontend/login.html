<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Manajemen Buku (FastAPI)</title>
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="node_modules/sweetalert2/dist/sweetalert2.min.css">

    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    
    <style>
        body{
            background: #ECE9E6;
            background: -webkit-linear-gradient(to right, #FFFFFF, #ECE9E6);
            background: linear-gradient(to right, #FFFFFF, #ECE9E6);
        }

        .card{
            width: 400px !important; 
            height: 530px !important; 
            background-color: #fefefe !important;
        }

        .batas{
            border-top: 1px solid #ccc;
            margin-top: 30px;
            padding-top: 5px;
        }

        form p:last-child{
            font-size: 0.815rem;
        }
    </style>

</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="row col-md-6 mt-3 justify-content-center align-items-center">
            <div class="card shadow-sm p-3 mb-5 bg-body rounded">
                <div class="card-body justify-content-center">
                    <form method="post">
                        <div class="row" style="margin-bottom: 2.5em; margin-top: 1.25rem">
                            <div class="col-12 text-start">
                                <h3 class="fs-2 fw-bold">Log in</h3>
                                <p class="fs-5 fw-light">Manajemen Buku Sederhana</p>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-3">
                            <div class="col-3 align-content-center">
                                <label for="username" class="form-label fw-bold">Username</label>
                            </div>
                            <div class="col-auto">
                                <input class="form-control" id="username"/>
                            </div>
                        </div>
                        <div class="row align-item-center d-grid mb-5">
                            <div class="col-3 align-content-center">
                                <label for="password" class="form-label fw-bold">Password</label>
                            </div>
                            <div class="col-auto">
                                <input type="password" class="form-control" id="password"/>
                            </div>
                        </div>
                        <div class="g-3">
                            <button class="btn btn-primary mx-auto" style="width: 100%;" onclick="loginUser(event);">Log in</button>
                        </div>

                        <p class="text-center mt-3">Perlu akun? <a href="/registrasi.html" class="text-decoration-none">Registrasi</a></p>
                    
                        <div class="batas"></div>

                        <p class="text-start fw-light">@2026 Damar Djati Wahyu Kemala</p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
