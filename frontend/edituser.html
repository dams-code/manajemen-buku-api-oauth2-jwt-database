<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Manajemen Buku (Fast API)</title>
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="node_modules/sweetalert2/dist/sweetalert2.min.css">
    
    <script src="js/token/cek_token.js"></script>

    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>

    <style>
        html, body{
            overflow: hidden;
        }

        body{
            background: #ECE9E6;
            background: -webkit-linear-gradient(to right, #FFFFFF, #ECE9E6);
            background: linear-gradient(to right, #FFFFFF, #ECE9E6);
        }

        .card{
            width: 500px;
        }

        .input{
            width: 290px;
        }

        .batas{
            border-top: 1px solid #ccc;
            margin-top: 18px;
            padding-top: 5px;
        }

        form .row.mb-1 .col-12 a p{
            font-size: 11px;;
        }

        form .row.mb-1 .col-12 a{
            text-decoration: none;
            width: max-content;
            background-color: #00913f;
            color: #fff;
            padding: 3px 10.5px;
            border-radius: 5px;
            font-weight: 600;
        }

        .dropdown-toggle::after{
            margin: auto !important;
        }
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid border-bottom border-dark-subtle pb-2 justify-content-between">
            <div class="navbar-brand">
                <p class="fs-2 m-0 fw-bold text-dark">Manajemen Buku Sederhana</p>
                <p class="text-start fw-light text-muted m-0">@2026 Damar DJati Wahyu Kemala</p>
            </div>

            <div class="row">
                <div class="col-12">
                    <button class="navbar-toggler ms-auto me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarContent">
                        
                        <div class="d-none d-xl-flex align-items-center me-3 text-muted small border-end pe-3">
                            <i class="bi bi-clock-history me-2 fs-5"></i>
                            <div>
                                <span id="tanggal_jam" class="fw-semibold"></span>
                            </div>
                        </div>

                        <ul class="nav nav-tabs border-0">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle d-flex gap-2 align-items-center bg-light rounded border" data-bs-toggle="dropdown" role="button" aria-expanded="false" href="javascript:void(0);">
                                    <i class="bi bi-person-circle fs-5 text-primary"></i>
                                    <span id="userAktif"></span>
                                    <span id="userRoleAktif" class="badge bg-secondary"></span>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                    <li><a class="dropdown-item" href="edituser.html"><i class="bi bi-person-gear me-2"></i>Edit User</a></li>
                                    <li>
                                        <a class="dropdown-item bg-primary bg-opacity-10 text-primary" href="gantipassword.html">
                                            <i class="bi bi-key me-2"></i>Ganti Password
                                        </a>
                                    </li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <button class="dropdown-item text-danger" type="button" onclick="logout();">
                                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                                        </button>
                                    </li>
                                </ul>
                            </li>
                        </ul>

                    </div>
                </div>
            </div>
        </div>

    <div class="container">
        <div class="row col-md-12 mt-5 justify-content-center">
            <div class="card shadow-sm p-3 bg-body-tertiary rounded justify-content-start">
                
                <div class="card-body justify-content-center">
                    <form action="post" class="d-grid">
                        <div class="row mb-1">
                            <div class="col-12">
                                <a href="/index.html" class="d-flex gap-2">
                                    <i class="bi bi-arrow-bar-left align-content-center"></i>
                                    <p class="m-0 p-0 align-content-center">Kembali</p>
                                </a>
                            </div>
                        </div>

                        <div class="batas"></div>

                        <div class="row" style="margin-bottom: 0.65em; margin-top: 0.75rem">
                            <div class="col-12 text-start">
                                <h3 class="fs-2 fw-bold">Edit User</h3>
                                <p class="fs-5 fw-light">Manajemen Buku Sederhana</p>
                            </div>
                        </div>

                        <div class="row d-flex col-12 flex-row align-item-start flex-nowrap gap-3 mb-3">
                            <div class="col-3 align-content-center">
                                <label for="username" class="form-label fw-bold m-0">Username</label>
                            </div>
                            <div class="col-9 align-self-center flex-fill">
                                <input type="text" id="username" class="form-control input" disabled="true"/>
                            </div>
                        </div>
                        <div class="row d-flex col-12 flex-row align-item-start flex-nowrap gap-3 mb-3">
                            <div class="col-3 align-content-center">
                                <label class="form-label fw-bold m-0" for="nama">Nama</label>
                            </div>
                            <div class="col-9 align-self-center">
                                <input type="text" id="nama" class="form-control input"/>
                            </div>
                        </div>
                        <div class="row d-flex col-12 flex-row align-item-start flex-nowrap gap-3 mb-3">
                            <div class="col-3 align-content-center">
                                <label for="list-role" class="form-label fw-bold m-0">Role</label>
                            </div>
                            <div class="col-9 align-self-center">
                                <select class="form-select input" id="list_role">
                                    <option value="">Pilih Role user</option>
                                    <option value="1">admin</option>
                                    <option value="2">manajer</option>
                                </select>
                            </div>
                        </div>

                        <div class="g-3 mt-4 mb-3">
                            <button class="btn btn-primary mx-auto" type="button" style="width: 100%;" onclick="updateUser(event);">Update</button>
                        </div>

                        <div class="batas"></div>

                        <p class="text-start fw-light">@2026 Damar Djati Wahyu Kemala</p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth/sesi_user_aktif.js" type="module"></script>
    <script src="js/editUser.js" type="module"></script>
    <script src="js/auth/logout.js"></script>

</html>
