<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku - Manajemen Buku (FastAPI)</title>
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="node_modules/sweetalert2/dist/sweetalert2.min.css">

    <script src="js/token/cek_token.js" type="module"></script>
    
    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>

    <style>

        html, body{
            overflow: hidden;
        }

        body{
            background: #ECE9E6;
            background: -webkit-linear-gradient(to right, #FFFFFF, #ECE9E6);
            background: linear-gradient(to right, #FFFFFF, #ECE9E6);
        }

        .batas{
            border-top: 1px solid #ccc;
            margin-top: 30px;
            padding-top: 5px;
        }

        .navbar-brand p:last-child{
            font-size: 0.815rem;
        }

        body nav:first-child{
            padding-bottom: 0 !important;
        }

        body nav:nth-child(2){
            background-color: #545454;
            box-shadow: 1px 3px 7px rgba(0, 0, 0, 0.29);
            padding: 8px 0;
            display: inline-block;
            width: 100%;
            padding-left: 0.8rem;
            padding-bottom: 12px;
        }

        body nav:nth-child(2) ol{
            margin-bottom: 0 !important;
        }

        body nav:nth-child(2) ol li:last-child,
        body nav:nth-child(2) ol li:last-child::before{
            color: #fff;
        }

        body nav:nth-child(2) ol li:first-child a{
            color: #1da0ff !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid border-bottom border-dark-subtle pb-2 justify-content-between">
            <div class="navbar-brand">
                <p class="fs-2 m-0 fw-bold text-dark">Manajemen Buku Sederhana</p>
                <p class="text-start fw-light text-muted m-0">@2026 Damar DJati Wahyu Kemala</p>
            </div>

            <div class="row">
                <div class="col-12">
                    <button class="navbar-toggler ms-auto me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarContent">
                        
                        <div class="d-none d-xl-flex align-items-center me-3 text-muted small border-end pe-3">
                            <i class="bi bi-clock-history me-2 fs-5"></i>
                            <div>
                                <span id="tanggal_jam" class="fw-semibold"></span>
                            </div>
                        </div>

                        <ul class="nav nav-tabs border-0">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle d-flex gap-2 align-items-center bg-light rounded border" data-bs-toggle="dropdown" role="button" aria-expanded="false" href="javascript:void(0);">
                                    <i class="bi bi-person-circle fs-5 text-primary"></i>
                                    <span id="userAktif"></span>
                                    <span id="userRoleAktif" class="badge bg-secondary"></span>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                    <li><a class="dropdown-item" href="edituser.html"><i class="bi bi-person-gear me-2"></i>Edit User</a></li>
                                    <li>
                                        <a class="dropdown-item bg-primary bg-opacity-10 text-primary" href="gantipassword.html">
                                            <i class="bi bi-key me-2"></i>Ganti Password
                                        </a>
                                    </li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <button class="dropdown-item text-danger" type="button" onclick="logout();">
                                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                                        </button>
                                    </li>
                                </ul>
                            </li>
                        </ul>

                    </div>
                </div>
            </div>
        </div>
    </nav>

    <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Halaman Utama</a></li>
            <li class="breadcrumb-item active" aria-current="page">Buku</li>
        </ol>
    </nav>

    <div class="container">
        <div class="row col-12 mt-3">

            <div class="text-end mb-3">
                <button class="btn btn-primary" id="btnTambahBuku" type="button" data-bs-toggle="modal" data-bs-target="#modalbuku" onclick="setTambahBuku();" style="display: none;">
                    <i class="bi bi-journal-plus"></i> Tambah Buku
                </button>
            </div>

            <table class="table table-light table-stripped text-center shadow p-3 mb-5 bg-body-tertiary rounded">
                <thead>
                    <th>Id</th>
                    <th>Judul</th>
                    <th>Penulis</th>
                    <th>Tahun</th>
                    <th>Qty</th>
                    <th>Genre</th>
                    <th>Tersedia</th>
                    <th>Aksi</th>
                    <th>Set Status</th>
                </thead>
                <tbody ID="dataBuku"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalbuku" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalJudul"></h1>
                </div>
                <div class="modal-body">
                    <form method="post">
                        <div class="d-grid row-gap-3">
                            <div class="row align-items-center" id="hide-id-tambah-buku">
                                <div class="col-2">
                                    <label for="id" class="col-form-label">Id</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" class="form-control" id="id" disabled="true" value="">
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="judul" class="col-form-label">judul</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" id="judul" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="penulis" class="col-form-label">Penulis</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" id="penulis" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="tahun" class="col-form-label">Tahun</label>
                                </div>
                                <div class="col-3">
                                    <input type="number" min="1000" max="9999" maxlength="4" class="form-control" id="tahun"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="qty" class="col-form-label" min="0">Qty</label>
                                </div>
                                <div class="col-3">
                                    <input type="number" id="qty" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="list_genre" class="col-form-label">Genre</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="list_genre">
                                        <option value="" selected>Pilih genre</option>
                                        <option value="edukasi">Edukasi</option>
                                        <option value="novel">Novel</option>
                                        <option value="fantasty">Fantasty</option>
                                        <option value="anak">Anak-anak</option>
                                        <option value="self-improvement">Self Improvement</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row align-items-center" style="display: none;">
                                <div class="col-2">
                                    <label for="tersedia" class="col-form-label">Tersedia</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="list_tersedia">
                                        <option value="" selected>Pilih</option>
                                        <option value="true">Tersedia</option>
                                        <option value="false">Tidak tersedia</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" onclick="simpan_buku();">Simpan</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="batas"></div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth/sesi_user_aktif.js" type="module"></script>
    <script src="js/buku.js" type="module"></script>
    <script src="js/logout.js"></script>
</body>
</html>
